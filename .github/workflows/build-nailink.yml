name: Build NaiLink Prebuilt Binaries

on:
  workflow_dispatch:
    inputs:
      nailink_ref:
        description: 'NaiLink git ref (tag/branch/commit)'
        required: true
        default: 'openwrt-v0.6.33'
      version:
        description: 'Version string written into packages'
        required: true
        default: '0.6.33'
      cpu:
        description: 'Target CPU for runtime.py'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - arm64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout NaiLink
        uses: actions/checkout@v4
        with:
          repository: slobys/NaiLink
          ref: ${{ inputs.nailink_ref }}
          submodules: recursive
          path: NaiLink
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: NaiLink/wing/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: NaiLink/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm python3 git

      - name: Build OpenWrt frontend
        working-directory: NaiLink
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/web build:openwrt

      - name: Prepare wing
        working-directory: NaiLink
        run: python3 openwrt/prepare-wing.py wing

      - name: Build runtime binaries
        working-directory: NaiLink
        run: |
          mkdir -p /tmp/nailink-sdk-cache /tmp/nailink-runtime
          python3 openwrt/runtime.py \
            --cpu "${{ inputs.cpu }}" \
            --wing wing \
            --web apps/web/dist-openwrt \
            --version "${{ inputs.version }}" \
            --work /tmp/nailink-sdk-cache \
            --output /tmp/nailink-runtime
          ls -lh /tmp/nailink-runtime/

      - name: Package artifacts
        run: |
          OUT="nailink-${{ inputs.version }}-${{ inputs.cpu }}"
          mkdir -p "$OUT"
          cp /tmp/nailink-runtime/daed "$OUT/"
          cp /tmp/nailink-runtime/btf-probe "$OUT/"
          cp /tmp/nailink-runtime/luci-proxy "$OUT/"
          chmod +x "$OUT"/*
          tar -czvf "${OUT}.tar.gz" "$OUT"
          sha256sum "${OUT}.tar.gz" | tee "${OUT}.tar.gz.sha256"
          echo "ARTIFACT_NAME=${OUT}" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            ${{ env.ARTIFACT_NAME }}.tar.gz.sha256
          retention-days: 90

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-${{ inputs.cpu }}
          name: NaiLink ${{ inputs.version }} (${{ inputs.cpu }})
          body: |
            Prebuilt binaries for ImmortalWrt / OpenWrt package integration.

            - Source: `slobys/NaiLink@${{ inputs.nailink_ref }}`
            - CPU: `${{ inputs.cpu }}`
            - Files: `daed`, `btf-probe`, `luci-proxy`

            ### Local ImmortalWrt usage
            ```bash
            export NAILINK_PREBUILT_URL=https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}-${{ inputs.cpu }}/nailink-${{ inputs.version }}-${{ inputs.cpu }}.tar.gz
