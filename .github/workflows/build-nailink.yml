name: Build NaiLink Prebuilt Binaries

on:
  workflow_dispatch:
    inputs:
      nailink_ref:
        description: 'NaiLink git ref (tag/branch/commit)'
        required: true
        default: 'openwrt-v0.6.33'
      version:
        description: 'Version string'
        required: true
        default: '0.6.33'
      cpu:
        description: 'Target CPU for runtime.py'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - arm64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout NaiLink
        uses: actions/checkout@v4
        with:
          repository: slobys/NaiLink
          ref: ${{ inputs.nailink_ref }}
          submodules: recursive
          path: NaiLink
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: |
            NaiLink/wing/go.sum
            NaiLink/wing/**/go.sum

      # pnpm 必須在 setup-node（cache: pnpm）之前
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: NaiLink/pnpm-lock.yaml

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm python3 git make

      - name: Build OpenWrt frontend
        working-directory: NaiLink
        run: |
          set -e
          pnpm install --no-frozen-lockfile

          # 先建 workspace 套件（含 dae-lsp，避免 monaco 解析失敗）
          if [ -d packages/dae-lsp ]; then
            pnpm --dir packages/dae-lsp run build || pnpm --filter '@daeuniverse/dae-lsp' run build || true
          fi
          pnpm -r --filter './packages/**' run build || true

          # 若有 turbo，按依賴順序再建一次
          if [ -f turbo.json ]; then
            pnpm exec turbo run build --filter='./packages/*' || true
          fi

          pnpm --dir apps/web build:openwrt
          test -d apps/web/dist-openwrt

      - name: Prepare wing
        working-directory: NaiLink
        run: |
          python3 openwrt/prepare-wing.py wing

      - name: Build runtime binaries
        working-directory: NaiLink
        run: |
          set -e
          mkdir -p /tmp/nailink-sdk-cache /tmp/nailink-runtime
          python3 openwrt/runtime.py \
            --cpu "${{ inputs.cpu }}" \
            --wing wing \
            --web apps/web/dist-openwrt \
            --version "${{ inputs.version }}" \
            --work /tmp/nailink-sdk-cache \
            --output /tmp/nailink-runtime
          ls -lh /tmp/nailink-runtime/
          test -f /tmp/nailink-runtime/daed
          test -f /tmp/nailink-runtime/btf-probe
          test -f /tmp/nailink-runtime/luci-proxy

      - name: Package artifacts
        id: package
        run: |
          set -e
          OUT="nailink-${{ inputs.version }}-${{ inputs.cpu }}"
          mkdir -p "$OUT"
          cp /tmp/nailink-runtime/daed "$OUT/"
          cp /tmp/nailink-runtime/btf-probe "$OUT/"
          cp /tmp/nailink-runtime/luci-proxy "$OUT/"
          chmod +x "$OUT"/*
          tar -czvf "${OUT}.tar.gz" "$OUT"
          sha256sum "${OUT}.tar.gz" | tee "${OUT}.tar.gz.sha256"
          ls -la "${OUT}.tar.gz" "${OUT}.tar.gz.sha256"
          echo "tarball=${PWD}/${OUT}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${PWD}/${OUT}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_NAME=${OUT}" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            ${{ env.ARTIFACT_NAME }}.tar.gz.sha256
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ inputs.version }}-${{ inputs.cpu }}
          name: NaiLink ${{ inputs.version }} (${{ inputs.cpu }})
          body: |
            Prebuilt binaries for ImmortalWrt / OpenWrt package integration.
            Files: daed, btf-probe, luci-proxy (${{ inputs.cpu }})
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum }}
          fail_on_unmatched_files: true
          make_latest: true
          
